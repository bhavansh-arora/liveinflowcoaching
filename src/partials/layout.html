<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <link rel="canonical" href="{{page.canonical}}">
  <meta name="theme-color" content="#f5f0e6">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site.name}}">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{page.canonical}}">
  <meta property="og:image" content="{{site.url}}/assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <script>
    /* Before first paint: show the preloader on the first visit of a session,
       or the page curtain when arriving from another page of this site. */
    (function (d) {
      var h = d.documentElement; h.classList.add('js');
      h.style.setProperty('--wave-t', (-(Date.now() % 9000) / 1000) + 's');
      try {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var s = window.sessionStorage;
        if (!s.getItem('lif-seen')) h.classList.add('is-loading');
        else if (s.getItem('lif-nav')) h.classList.add('is-entering');
        /* Safety net: never leave the page covered if a script fails. */
        setTimeout(function () { if (!h.classList.contains('motion-ready')) h.classList.remove('is-loading', 'is-entering'); }, 6000);
      } catch (e) {}
    })(document);
  </script>
  <style>
    html.is-entering, html.is-loading { background: #082b2c; }
    .curtain { position: fixed; inset: 0; z-index: 790; background: #082b2c; transform: translateY(101%); }
    html.is-entering .curtain { transform: none; }
    .preloader { position: fixed; inset: 0; z-index: 800; background: #082b2c; color: #f5f0e6; display: none; overflow: hidden; }
    html.is-loading .preloader { display: grid; place-items: center; }
    .curtain__sea { position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; overflow: hidden; }
    .pl-waves { position: absolute; left: 0; bottom: 0; width: 200%; max-width: none; height: 100%; animation: pl-flow 9s linear infinite; animation-delay: var(--wave-t, 0s); will-change: transform; }
    .pl-wave--1 { fill: rgba(13, 103, 102, 0.55); } .pl-wave--2 { fill: rgba(14, 75, 76, 0.85); } .pl-wave--3 { fill: #0b3a3b; }
    @keyframes pl-flow { to { transform: translateX(-50%); } }
  </style>
  <link rel="preload" href="assets/fonts/inter-tight-normal-300-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/instrument-serif-italic-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "{{site.name}}",
    "url": "{{site.url}}",
    "email": "{{site.email}}",
    "image": "{{site.url}}/assets/img/og.jpg",
    "description": "Career transition coaching for tech professionals: clarity, confidence and purpose-driven work.",
    "areaServed": ["Vancouver", "British Columbia", "Canada", "Worldwide (virtual)"],
    "address": { "@type": "PostalAddress", "addressLocality": "Vancouver", "addressRegion": "BC", "addressCountry": "CA" },
    "founder": {
      "@type": "Person",
      "name": "{{site.owner}}",
      "jobTitle": "Career transition coach",
      "hasCredential": ["ICF Professional Certified Coach (PCC)", "Certified Professional Co-Active Coach (CPCC)"],
      "sameAs": ["{{site.links.linkedin}}", "{{site.links.instagram}}", "{{site.links.facebook}}"]
    }
  }
  </script>
</head>
<body class="{{page.bodyClass}}" data-page="{{page.slug}}" id="top">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="preloader" aria-hidden="true">
    <div class="preloader__glow"></div>
    <div class="preloader__top"><span class="label">Live in Flow Coaching</span><span class="label">Vancouver &middot; Worldwide</span></div>
    <div class="preloader__inner">
      <span class="preloader__mark">{{> logo-mark}}</span>
      <p class="preloader__name"><span class="pl-mask"><span>Live in</span></span> <span class="pl-mask"><em>Flow</em></span></p>
      <p class="preloader__tag"><span class="pl-mask"><span>Career coaching with Maria Angoso</span></span></p>
    </div>
    <div class="preloader__sea"><svg class="pl-waves" viewBox="0 0 1600 200" preserveAspectRatio="none" aria-hidden="true">
        <path class="pl-wave pl-wave--1" d="M0 70c100-40 200 40 400 0s300-40 400 0 300 40 400 0 300-40 400 0v130H0z"/>
        <path class="pl-wave pl-wave--2" d="M0 100c100-34 200 34 400 0s300-34 400 0 300 34 400 0 300-34 400 0v100H0z"/>
        <path class="pl-wave pl-wave--3" d="M0 130c100-26 200 26 400 0s300-26 400 0 300 26 400 0 300-26 400 0v70H0z"/>
      </svg></div>
    <div class="preloader__bottom">
      <p class="preloader__words"><span>Clarity</span><span>Confidence</span><span>Courage</span><span>Flow</span></p>
      <p class="preloader__count"><span data-count>0</span><sup>%</sup></p>
    </div>
    <div class="preloader__bar"><i></i></div>
  </div>
  <div class="curtain" aria-hidden="true">
    <div class="curtain__inner">
      <span class="curtain__mark">{{> logo-mark}}</span>
      <p class="curtain__brand">Live in <em>Flow</em></p>
      <p class="curtain__page"><span class="curtain__dot"></span><span class="curtain__title">{{page.curtain}}</span></p>
    </div>
    <div class="curtain__sea"><svg class="pl-waves" viewBox="0 0 1600 200" preserveAspectRatio="none" aria-hidden="true">
      <path class="pl-wave pl-wave--1" d="M0 70c100-40 200 40 400 0s300-40 400 0 300 40 400 0 300-40 400 0v130H0z"/>
      <path class="pl-wave pl-wave--2" d="M0 100c100-34 200 34 400 0s300-34 400 0 300 34 400 0 300-34 400 0v100H0z"/>
      <path class="pl-wave pl-wave--3" d="M0 130c100-26 200 26 400 0s300-26 400 0 300 26 400 0 300-26 400 0v70H0z"/>
    </svg></div>
  </div>
  <div class="scroll-progress" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span class="cursor__label"></span></div>

  {{> header}}

  <main id="main">
{{page.content}}
  </main>

  {{> footer}}

  <a class="sticky-cta" href="{{site.links.bookCall}}" target="_blank" rel="noopener">Book a free 20-min call {{> arrow}}</a>

  <script src="assets/vendor/gsap.min.js" defer></script>
  <script src="assets/vendor/ScrollTrigger.min.js" defer></script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/site.js" defer></script>
  <script src="assets/js/motion.js" defer></script>
</body>
</html>
